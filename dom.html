<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 5 - Part 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html">Part 1</a>
    <a href="dom.html">Part 2</a>
  </nav>

  <div class="container">
    <h2>Part 2: DOM Manipulation</h2>

    <div class="task-box">
      <h3>Task 2: Changing Content</h3>
      <p id="myParagraph">All AITU teachers are the best.</p>
      <button id="changeTextBtn">Change Text</button>
    </div>

    <div class="task-box">
      <h3>Task 3: Changing Styles</h3>
      <div id="styleBox" style="padding: 15px; background-color: red; border-radius: 4px;">
        <p id="boxText" style="margin: 0; font-size: 16px;">This container and text will change styling dynamically.</p>
      </div>
      <br>
      <button id="changeColorBtn">Change Background Color</button>
      <button id="changeFontSizeBtn">Change Font Size</button>
    </div>

    <div class="task-box">
      <h3>Task 4: Creating & Removing Elements</h3>
      <button id="addItemBtn">Add Item</button>
      <button id="removeItemBtn">Remove Item</button>
      <ul id="itemList">
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
